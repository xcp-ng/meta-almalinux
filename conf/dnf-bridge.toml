archs = [
    "x86_64_v2",
    "aarch64",
]

# # this package is available in Alma and EPEL with same version and different checksums
# allowed_mismatched_checksums = ['epel-release-almalinux-altarch']

[[repo]]
name = "almalinux-10.2"

# Main mirrors are on repo.almalinux.org for current releases and
# vault.almalinux.org for EOL'd.  Since that depends on the release
# we're mirroring (as well as on time) we use a single variable for
# those coupled parameters.
basesrcurl = "https://vault.almalinux.org/10.2"
baseurl = "https://repo.almalinux.org/almalinux/10.2"

# not included "devel" as it overlaps with everything else and all we
# need from it appear to be in EPEL already
sections = ["BaseOS", "AppStream", "CRB"]
srcurl = "{basesrcurl}/{section}/Source/"
binurl = "{baseurl}/{section}/{arch}/os/"

recipes = "recipes-almalinux"
basesrcurl_bbvar = "ALMALINUXSRC_MIRROR"
baseurl_bbvar = "ALMALINUX_MIRROR"
default_bbvar_conf = "almalinux-defaults.conf"

exclude_packages = [
    # meta-xcpng ships an older ocaml, and something with all the PROVIDES
    # in ocaml_5.2.0-4.el10 does not play well with PREFERRED_VERSION_ocaml
    "ocaml",
    "ocaml-findlib",
    # packages depending on the above, removed to avoid noise
    "ocaml-augeas",
    "ocaml-calendar",
    "ocaml-cppo",
    "ocaml-curses",
    "ocaml-dune",
    "ocaml-fileutils",
    "ocaml-gettext",
    "ocaml-labltk",
    "ocaml-libvirt",
    "ocaml-ocamlbuild",
    "ocaml-srpm-macros",
]

[[repo]]
name = "epel-10.2"

# Main mirrors are on repo.almalinux.org for current releases and
# vault.almalinux.org for EOL'd.  Since that depends on the release
# we're mirroring (as well as on time) we use a single variable for
# those coupled parameters.
basesrcurl = "https://dl.fedoraproject.org/pub/epel/10.2/Everything/source/tree"
baseurl = "https://dl.fedoraproject.org/pub/epel/10.2/Everything"

altarch.x86_64_v2.suffix = ".alma_altarch"
altarch.x86_64_v2.baseurl = "https://epel.repo.almalinux.org/10.2"
altarch.x86_64_v2.baseurl_bbvar = "EPEL_ALTARCH_MIRROR"
altarch.x86_64_v2.basesrcurl = "https://epel.vault.almalinux.org/10.2/Source"

srcurl = "{basesrcurl}/"
binurl = "{baseurl}/{arch}/"

recipes = "recipes-epel"
basesrcurl_bbvar = "EPELSRC_MIRROR"
baseurl_bbvar = "EPEL_MIRROR"
default_bbvar_conf = "epel-defaults.conf"

exclude_packages = [
    # packages depending on ocaml, removed to avoid noise
    "ocaml-camlpdf",
    "ocaml-cpdf",
    # "_remove" flagged by Bitbake as old syntax for ":remove"
    "dnf-plugin-flunk_dependent_remove",
    # has a strange Requires: /etc/pki/tls/certs fulfilled by
    # ca-certificates and openssl-libs, but bb does not want to
    # have 2 providers required/installed at the same time
    "exim",
]
